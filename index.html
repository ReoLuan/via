<title>via.</title>
<style>
  :root {
    --green: #32B667;   /* screen candidate; replace with the final Via green */
    /* Logo ratios from the 200 pt master (stem 17, dot 44.5, gap 17) */
    --dot: 0.2225em;
    --gap: 0.085em;
    --a-overshoot: 0.012em; /* how far the a's round bottom dips below the baseline */
    --a-rsb: 0em;           /* the a's right side bearing; set it to measure the gap from the a's ink */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #fff; color: #000; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: clamp(15px, 1.6vw, 20px); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 72px 32px; }
  .text { width: 23em; max-width: 100%; }
  .text p + p { margin-top: 1.6em; }

  /* Wordmark: Helvetica Neue Regular, lowercase, default kerning and tracking */
  .mark {
    position: fixed; left: 32px; bottom: 28px;
    height: 16px; width: auto; display: block;
  }
  .mark .dot {
    display: inline-block;
    width: var(--dot); height: var(--dot);
    margin-left: calc(var(--gap) - var(--a-rsb));
    border-radius: 50%;
    background: var(--green);
    vertical-align: calc(-1 * var(--a-overshoot)); /* bottom rests on the a's bottom */
  }
  
</style>

    <p>Cards ship beginning January 1, 2027.</p>
  </div>
</main>
